# Integration example ONLY. This file is not installed by the frontend build.
# Inside the existing Nginx server block, REPLACE location = /auth/login
# with the block below, and ADD the remaining locations.
# The root assumes frontend/northpoint is mounted at /usr/share/nginx/html.
# If the mount is the entire frontend directory, use /usr/share/nginx/html/northpoint.

location = /auth/login {
    limit_req zone=login burst=10 nodelay;
    # Keep the public URL and its next query while serving the new frontend UI.
    if ($request_method = GET) { rewrite ^ /login.html last; }
    proxy_pass http://auth:8000/login;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors on;
    error_page 401 = @northpoint_signin_invalid;
    error_page 429 = @northpoint_signin_limited;
}

location = /login.html {
    auth_request off;
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
    try_files /login.html =404;
}

location @northpoint_signin_invalid {
    return 303 /login.html?error=credentials&next=$arg_next;
}
location @northpoint_signin_limited {
    return 303 /login.html?error=rate_limited&next=$arg_next;
}
