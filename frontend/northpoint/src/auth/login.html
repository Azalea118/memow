<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fa">
  <meta name="description" content="Sign in to Northpoint Manpower Services Violation Management.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; form-action 'self'; base-uri 'none'; object-src 'none'">
  <meta name="referrer" content="same-origin">
  <title>Sign in · Northpoint</title>
  <link rel="icon" type="image/png" href="../assets/company-logo.png">
  <link rel="stylesheet" href="../styles/login.css">
</head>
<body>
  <main class="signin-shell">
    <section class="signin-card" aria-labelledby="brand-title">
      <header class="signin-brand">
        <div class="brand-logo"><img src="../assets/northpoint-wordmark.jpg" alt="Northpoint Manpower Services logo" width="1080" height="1080"></div>
        <h1 id="brand-title">Northpoint Manpower Services</h1>
        <p>Violation Management</p>
      </header>
      <div class="signin-heading"><h2>Sign in</h2><p>Enter your account details to continue.</p></div>
      <p id="signin-error" class="signin-error" role="alert" tabindex="-1" hidden></p>
      <form id="signin-form" method="post" action="/auth/login">
        <input type="hidden" name="next" id="signin-next" value="/">
        <div class="signin-field"><label for="signin-username">Username</label><input id="signin-username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="Enter your username"></div>
        <div class="signin-field"><label for="signin-password">Password</label><div class="password-field"><input id="signin-password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password"><button id="password-toggle" type="button" aria-label="Show password" aria-pressed="false" aria-controls="signin-password"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle><path class="eye-slash" d="m3 3 18 18" hidden></path></svg></button></div><span id="caps-warning" class="caps-warning" role="status" hidden>Caps Lock is on.</span></div>
        <button class="signin-submit" id="signin-submit" type="submit"><span>Sign in</span><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"></path></svg></button>
      </form>
      <p class="signin-help">Use the account provided by your administrator.</p>
    </section>
    <footer class="signin-footer"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"></path><path d="m8 12 3 3 5-6"></path></svg><span>Northpoint · Authorized access only</span></footer>
  </main>
  <script src="./login.js"></script>
</body>
</html>
