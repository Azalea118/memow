x-app: &app
  build: .
  image: backend
  working_dir: /app
  environment:
    - TZ=Asia/Manila
  volumes:
    - .:/app

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [nginx]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on: [app1, app2, app3]

  app1:
    <<: *app
    command: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --root-path /app1

  app2:
    <<: *app
    command: uv run --no-sync uvicorn pt_service.main:pt_app --host 0.0.0.0 --port 8000 --reload --proxy-headers --root-path /app2

  app3:
    <<: *app
    command: uv run --no-sync uvicorn gps_service.main:gps_service --host 0.0.0.0 --port 8000 --reload --proxy-headers --root-path /app3

volumes:
  caddy_data:
